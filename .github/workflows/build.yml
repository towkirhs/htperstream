name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Test and build
        run: |
          set -o pipefail
          gradle --no-daemon testReleaseUnitTest assembleRelease 2>&1 | tee build.log
      - name: Report errors
        if: failure()
        run: |
          msg=$(grep -E "^e: |error:|What went wrong|^> |FAILED|Unresolved|expected:|Exception" build.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=build::$msg"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk HyperStream.apk
          gh release create "v0.1.${{ github.run_number }}" HyperStream.apk --title "HyperStream v0.1.${{ github.run_number }}" --notes "Automatic build of ${{ github.sha }}"
